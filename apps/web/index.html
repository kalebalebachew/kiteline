<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#121319" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafbfd" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kiteline" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <title>Kiteline</title>
    <script>
      (() => {
        let theme = "dark";
        try {
          theme = localStorage.getItem("kiteline-theme") || "dark";
        } catch {}
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
